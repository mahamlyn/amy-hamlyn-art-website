<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Amy Hamlyn Art{% endblock %}</title>
    <meta name="description" content="Amy Hamlyn Art — contemporary artwork, exhibitions, and artist blog.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  </head>
  <body>
    <header class="site-header">
      <div class="container nav-wrap">
        <a class="brand" href="/">Amy Hamlyn Art</a>
        <nav class="nav" aria-label="Main navigation">
          <a href="/">Home</a>
          <a href="/about">About</a>
          <a href="/gallery">Gallery</a>
          <a href="/exhibitions">Exhibitions</a>
          <a href="/blog">Blog</a>
          <a href="/contact">Contact</a>
        </nav>
      </div>
    </header>

    <main>
      {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
      <div class="container footer-wrap">
        <div>
          <p class="brand small-brand">Amy Hamlyn Art</p>
        </div>
        <div class="footer-links">
          <a href="/about">About</a>
          <a href="/gallery">Gallery</a>
          <a href="/exhibitions">Exhibitions</a>
          <a href="/contact">Commission</a>
        </div>
        <p>hello@amyhamlynart.com</p>
      </div>
    </footer>
  </body>
</html>
